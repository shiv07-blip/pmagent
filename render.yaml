services:
  - type: web
    name: pmagent
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 8080
      - key: API_HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
      - key: NOTIFY_PROVIDER
        value: telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_DATABASE_URL
        sync: false
      - key: WORKER_DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
