services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pmagent-postgres
    environment:
      POSTGRES_USER: pmagent
      POSTGRES_PASSWORD: pmagent
      POSTGRES_DB: pmagent
    ports:
      - "5432:5432"
    volumes:
      - pmagent-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmagent -d pmagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pmagent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - pmagent-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmagent-pgdata:
  pmagent-redisdata:
